directories:
  output: dist
  buildResources: build
appId: com.gridweatherreporter.app
productName: GRID Weather Reporter
files:
  - filter:
      - '**/*'
      - '!tests/**'
      - '!dist/**'
      - '!*.log'
      - '!package-lock.json'
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: GRID-Weather-Reporter-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GRID Weather Reporter
electronVersion: 43.4.0
